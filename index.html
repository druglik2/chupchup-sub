<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chup Chup 구독 서비스</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kakao: {
              yellow: '#FEE500',
              brown: '#3C1E1E',
              bg: '#F2F2F2',
              card: '#FFFFFF',
              gray: '#868B94',
              lightGray: '#E9E9E9'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f2f2f2;
    }
    .kakaotalk-shadow {
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-2 sm:p-4">

  <!-- Mobile Container -->
  <div id="app" class="w-full max-w-md bg-kakao-bg min-h-[840px] rounded-3xl shadow-2xl overflow-hidden flex flex-col relative border border-gray-200">
    
    <!-- Top Header -->
    <header class="bg-kakao-yellow px-5 py-4 flex justify-between items-center text-kakao-brown sticky top-0 z-50">
      <div class="flex items-center space-x-2">
        <i class="fa-solid font-bold text-xl fa-mug-hot"></i>
        <span class="font-extrabold text-lg tracking-tight">Chup Chup</span>
      </div>
      <!-- Mode Switcher Badge -->
      <button onclick="toggleRole()" id="roleBadge" class="bg-kakao-brown text-kakao-yellow text-xs font-bold px-3 py-1.5 rounded-full shadow transition-transform active:scale-95 flex items-center gap-1">
        <i class="fa-solid fa-user-gear"></i>
        <span id="roleText">관리자 모드 전환</span>
      </button>
    </header>

    <!-- App Main Body -->
    <main class="flex-1 overflow-y-auto p-4 space-y-4 pb-24">

      <!-- ================= CUSTOMER VIEW ================= -->
      <div id="customerView" class="space-y-4">
        
        <!-- Active Subscription Dashboard (Kakao Style Card) -->
        <div class="bg-white rounded-2xl p-4 kakaotalk-shadow border border-yellow-100 relative overflow-hidden">
          <div class="flex justify-between items-start mb-3">
            <div>
              <span class="text-xs text-gray-500 font-medium">나의 구독권</span>
              <h3 id="userActivePlanTitle" class="font-bold text-lg text-kakao-brown">아메리카노 30일 이용권</h3>
            </div>
            <span id="userStatusBadge" class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-full">이용중</span>
          </div>

          <!-- Progress Bar -->
          <div class="space-y-1 mb-4">
            <div class="flex justify-between text-xs font-semibold text-gray-600">
              <span>구독 기간</span>
              <span>12일 / 30일</span>
            </div>
            <div class="w-full bg-gray-100 rounded-full h-2.5">
              <div class="bg-kakao-yellow h-2.5 rounded-full" style="width: 40%"></div>
            </div>
          </div>

          <!-- QR Code Generator Section -->
          <div class="bg-kakao-yellow/20 rounded-xl p-4 text-center border border-yellow-200/50">
            <div class="flex justify-between items-center text-xs text-kakao-brown font-bold mb-2">
              <span>오늘의 1잔 교환 QR</span>
              <span id="qrTimer" class="text-red-500 font-mono"><i class="fa-regular fa-clock mr-1"></i>58초 남음</span>
            </div>
            
            <div id="qrArea" class="bg-white p-3 rounded-lg inline-block shadow-sm my-1">
              <!-- Simulated Barcode / QR -->
              <div class="flex flex-col items-center">
                <div class="flex space-x-1 h-12 items-center px-4" id="barcodeBars">
                  <div class="w-1 h-10 bg-black"></div><div class="w-2 h-10 bg-black"></div><div class="w-0.5 h-10 bg-black"></div><div class="w-1.5 h-10 bg-black"></div><div class="w-1 h-10 bg-black"></div><div class="w-3 h-10 bg-black"></div><div class="w-1 h-10 bg-black"></div>
                </div>
                <span id="qrCodeText" class="text-xs font-mono font-bold tracking-widest text-gray-600 mt-1">CC-2026-0926-8812</span>
              </div>
            </div>

            <p id="redeemStatusNotice" class="text-xs text-gray-600 mt-2">매장 POS에서 스캐너로 QR을 제시해주세요.</p>
          </div>
        </div>

        <!-- Subscription Plan Store -->
        <div class="space-y-3">
          <h2 class="font-bold text-gray-800 text-sm px-1 flex items-center gap-1.5">
            <i class="fa-solid fa-store text-yellow-500"></i> 구독 요금제 선택
          </h2>

          <div id="plansList" class="space-y-3">
            <!-- Plans rendering via JS -->
          </div>
        </div>

      </div>

      <!-- ================= ADMIN VIEW ================= -->
      <div id="adminView" class="hidden space-y-4">

        <!-- Admin Sub-Navigation -->
        <div class="flex bg-gray-200 p-1 rounded-xl text-xs font-bold text-gray-600">
          <button onclick="switchAdminTab('dashboard')" id="tabBtnDashboard" class="flex-1 py-2 rounded-lg bg-white text-kakao-brown shadow-sm">대시보드</button>
          <button onclick="switchAdminTab('pos')" id="tabBtnPos" class="flex-1 py-2 rounded-lg hover:text-kakao-brown">POS QR 스캐너</button>
          <button onclick="switchAdminTab('menu')" id="tabBtnMenu" class="flex-1 py-2 rounded-lg hover:text-kakao-brown">메뉴 관리</button>
        </div>

        <!-- Tab 1: Dashboard -->
        <div id="adminTabDashboard" class="space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-2xl kakaotalk-shadow">
              <span class="text-xs text-gray-500 font-bold">총 구독 회원수</span>
              <div class="text-2xl font-extrabold text-kakao-brown mt-1" id="totalSubscribersCount">128 명</div>
            </div>
            <div class="bg-white p-4 rounded-2xl kakaotalk-shadow">
              <span class="text-xs text-gray-500 font-bold">오늘 사용율</span>
              <div class="text-2xl font-extrabold text-emerald-600 mt-1" id="redemptionRateText">42.1%</div>
            </div>
          </div>

          <div class="bg-white p-4 rounded-2xl kakaotalk-shadow space-y-2">
            <span class="text-xs text-gray-500 font-bold">오늘 교환된 음료 건수</span>
            <div class="flex justify-between items-baseline">
              <span class="text-xl font-bold text-gray-800" id="todayRedeemedCount">54 건</span>
              <span class="text-xs text-gray-400">기준: 오늘 00:00 ~ 현재</span>
            </div>
          </div>
        </div>

        <!-- Tab 2: POS Scanner Simulation -->
        <div id="adminTabPos" class="hidden space-y-3">
          <div class="bg-white p-4 rounded-2xl kakaotalk-shadow space-y-3 border border-yellow-200">
            <div class="flex items-center justify-between">
              <h3 class="font-bold text-kakao-brown text-sm">
                <i class="fa-solid fa-qrcode text-yellow-500 mr-1"></i> 매장 POS QR 스캐너
              </h3>
              <span class="text-[10px] bg-kakao-yellow px-2 py-0.5 rounded font-bold text-kakao-brown">실시간 중복 검증</span>
            </div>

            <div class="bg-gray-900 rounded-xl p-6 text-center text-white space-y-3 relative overflow-hidden">
              <i class="fa-solid fa-barcode text-4xl text-kakao-yellow animate-pulse"></i>
              <p class="text-xs text-gray-300">고객의 Chup Chup 구독 QR 코드를 스캔하세요.</p>
              
              <div class="flex gap-2">
                <input type="text" id="posScanInput" placeholder="QR 코드 번호 입력" class="w-full px-3 py-2 text-xs text-gray-800 rounded-lg outline-none font-mono">
                <button onclick="simulateScan()" class="bg-kakao-yellow text-kakao-brown font-bold text-xs px-4 py-2 rounded-lg whitespace-nowrap active:scale-95">스캔하기</button>
              </div>
            </div>

            <!-- Scan Alert Box -->
            <div id="scanResultBox" class="hidden p-3 rounded-xl text-xs font-bold"></div>
          </div>
        </div>

        <!-- Tab 3: Menu Management -->
        <div id="adminTabMenu" class="hidden space-y-3">
          <!-- Add Menu Form -->
          <div class="bg-white p-4 rounded-2xl kakaotalk-shadow space-y-3">
            <h3 class="font-bold text-kakao-brown text-sm">구독 상품/메뉴 추가</h3>
            <div class="space-y-2">
              <input type="text" id="newPlanName" placeholder="상품명 (예: 라떼 + 쿠키 30일권)" class="w-full text-xs p-2.5 bg-gray-50 border rounded-xl outline-none focus:border-yellow-400">
              <input type="number" id="newPlanPrice" placeholder="가격 (원)" class="w-full text-xs p-2.5 bg-gray-50 border rounded-xl outline-none focus:border-yellow-400">
              <button onclick="addNewPlan()" class="w-full bg-kakao-brown text-kakao-yellow font-bold text-xs py-2.5 rounded-xl shadow active:scale-95">신규 구독 상품 등록</button>
            </div>
          </div>

          <!-- Existing Plans List -->
          <div class="bg-white p-4 rounded-2xl kakaotalk-shadow space-y-3">
            <h3 class="font-bold text-kakao-brown text-sm">등록된 구독 상품 목록</h3>
            <div id="adminPlansList" class="space-y-2">
              <!-- Rendered via JS -->
            </div>
          </div>
        </div>

      </div>

    </main>

    <!-- Bottom Navigation Bar (KakaoTalk Style) -->
    <nav class="bg-white border-t border-gray-200 px-6 py-2 flex justify-around items-center fixed bottom-0 w-full max-w-md z-50 rounded-b-3xl">
      <button onclick="setRole('customer')" id="navCustomerBtn" class="flex flex-col items-center text-kakao-brown font-bold text-xs">
        <i class="fa-solid fa-coffee text-lg mb-0.5"></i>
        <span>구독하기</span>
      </button>
      <button onclick="setRole('admin')" id="navAdminBtn" class="flex flex-col items-center text-gray-400 text-xs">
        <i class="fa-solid fa-sliders text-lg mb-0.5"></i>
        <span>관리자</span>
      </button>
    </nav>

  </div>

  <script>
    // App Initial State
    let state = {
      role: 'customer', // 'customer' | 'admin'
      adminTab: 'dashboard',
      userHasRedeemedToday: false,
      totalSubscribers: 128,
      todayRedeemedCount: 54,
      currentQrCode: "CC-2026-0926-8812",
      plans: [
        { id: 1, name: "아메리카노 30일 이용권", price: 29800, badge: "인기", desc: "매일 아메리카노 1잔 제공" },
        { id: 2, name: "라떼류 30일 이용권", price: 49800, badge: "추천", desc: "카페라떼/바닐라라떼 등 1잔" },
        { id: 3, name: "아메리카노 + 쿠키 30일권", price: 59600, badge: "+쿠키", desc: "매일 아메리카노 1잔 + 수제 쿠키 1개" },
        { id: 4, name: "라떼 + 쿠키 30일권", price: 79600, badge: "프리미엄", desc: "매일 라떼 1잔 + 수제 쿠키 1개" }
      ]
    };

    // Initialize App
    document.addEventListener('DOMContentLoaded', () => {
      renderPlans();
      updateDashboardStats();
      startQrTimer();
    });

    // Role Switching
    function toggleRole() {
      setRole(state.role === 'customer' ? 'admin' : 'customer');
    }

    function setRole(role) {
      state.role = role;
      const customerView = document.getElementById('customerView');
      const adminView = document.getElementById('adminView');
      const roleText = document.getElementById('roleText');
      const navCustomerBtn = document.getElementById('navCustomerBtn');
      const navAdminBtn = document.getElementById('navAdminBtn');

      if (role === 'customer') {
        customerView.classList.remove('hidden');
        adminView.classList.add('hidden');
        roleText.innerText = "관리자 모드 전환";
        navCustomerBtn.className = "flex flex-col items-center text-kakao-brown font-bold text-xs";
        navAdminBtn.className = "flex flex-col items-center text-gray-400 text-xs";
      } else {
        customerView.classList.add('hidden');
        adminView.classList.remove('hidden');
        roleText.innerText = "고객 모드 전환";
        navCustomerBtn.className = "flex flex-col items-center text-gray-400 text-xs";
        navAdminBtn.className = "flex flex-col items-center text-kakao-brown font-bold text-xs";
      }
    }

    // Admin Tab Switcher
    function switchAdminTab(tab) {
      state.adminTab = tab;
      ['Dashboard', 'Pos', 'Menu'].forEach(t => {
        const tabEl = document.getElementById(`adminTab${t}`);
        const btnEl = document.getElementById(`tabBtn${t}`);
        if (t.toLowerCase() === tab) {
          tabEl.classList.remove('hidden');
          btnEl.className = "flex-1 py-2 rounded-lg bg-white text-kakao-brown shadow-sm font-bold";
        } else {
          tabEl.classList.add('hidden');
          btnEl.className = "flex-1 py-2 rounded-lg text-gray-500 font-medium hover:text-kakao-brown";
        }
      });
    }

    // Render Subscription Plans
    function renderPlans() {
      const plansList = document.getElementById('plansList');
      const adminPlansList = document.getElementById('adminPlansList');

      // Customer View Cards
      plansList.innerHTML = state.plans.map(plan => `
        <div class="bg-white rounded-2xl p-4 kakaotalk-shadow border border-gray-100 flex justify-between items-center">
          <div class="space-y-1">
            <div class="flex items-center gap-1.5">
              <span class="font-bold text-gray-900 text-sm">${plan.name}</span>
              ${plan.badge ? `<span class="bg-yellow-100 text-yellow-800 text-[10px] font-bold px-2 py-0.5 rounded-md">${plan.badge}</span>` : ''}
            </div>
            <p class="text-xs text-gray-500">${plan.desc}</p>
            <div class="text-sm font-extrabold text-kakao-brown">${plan.price.toLocaleString()}원 <span class="text-[10px] text-gray-400 font-normal">/ 30일</span></div>
          </div>
          <button onclick="subscribePlan('${plan.name}')" class="bg-kakao-yellow text-kakao-brown font-bold text-xs px-3.5 py-2 rounded-xl shadow active:scale-95 hover:brightness-95">
            구독하기
          </button>
        </div>
      `).join('');

      // Admin View Items
      adminPlansList.innerHTML = state.plans.map(plan => `
        <div class="bg-gray-50 p-3 rounded-xl flex justify-between items-center border border-gray-200">
          <div>
            <div class="font-bold text-xs text-gray-800">${plan.name}</div>
            <div class="text-xs font-bold text-kakao-brown">${plan.price.toLocaleString()}원</div>
          </div>
          <button onclick="deletePlan(${plan.id})" class="text-xs text-red-500 hover:bg-red-50 p-1.5 rounded-lg font-bold">
            <i class="fa-solid fa-trash-can"></i> 삭제
          </button>
        </div>
      `).join('');
    }

    // Subscribe Action
    function subscribePlan(planName) {
      document.getElementById('userActivePlanTitle').innerText = planName;
      alert(`[카카오페이 결제 완료]\n'${planName}' 구독이 정상적으로 시작되었습니다.`);
    }

    // Add Plan in Admin
    function addNewPlan() {
      const nameInput = document.getElementById('newPlanName');
      const priceInput = document.getElementById('newPlanPrice');

      if (!nameInput.value || !priceInput.value) {
        alert('상품명과 가격을 모두 입력해 주세요.');
        return;
      }

      state.plans.push({
        id: Date.now(),
        name: nameInput.value,
        price: parseInt(priceInput.value),
        badge: "NEW",
        desc: "새로 등록된 30일 구독 상품"
      });

      nameInput.value = '';
      priceInput.value = '';
      renderPlans();
      alert('신규 구독 상품이 등록되었습니다.');
    }

    // Delete Plan in Admin
    function deletePlan(id) {
      state.plans = state.plans.filter(p => p.id !== id);
      renderPlans();
    }

    // Simulated Scan Execution
    function simulateScan() {
      const input = document.getElementById('posScanInput');
      const resultBox = document.getElementById('scanResultBox');
      const code = input.value.trim() || state.currentQrCode;

      resultBox.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-emerald-100', 'text-emerald-800');

      if (state.userHasRedeemedToday) {
        // Block Duplicate Scan
        resultBox.classList.add('bg-red-100', 'text-red-800');
        resultBox.innerHTML = `<i class="fa-solid fa-circle-exclamation mr-1"></i> [스캔 실패] 오늘 이미 사용 완료된 구독권입니다. (중복 사용 불가)`;
      } else {
        // Successful Scan
        state.userHasRedeemedToday = true;
        state.todayRedeemedCount += 1;
        updateDashboardStats();

        resultBox.classList.add('bg-emerald-100', 'text-emerald-800');
        resultBox.innerHTML = `<i class="fa-solid fa-circle-check mr-1"></i> [스캔 성공] 승인 완료! (1잔 교환 처리되었습니다)`;

        // Update Customer view UI
        document.getElementById('redeemStatusNotice').innerText = "✅ 오늘 1잔 교환이 완료되었습니다.";
        document.getElementById('redeemStatusNotice').className = "text-xs font-bold text-emerald-600 mt-2";
      }

      input.value = '';
    }

    // Dashboard Stats update
    function updateDashboardStats() {
      document.getElementById('totalSubscribersCount').innerText = `${state.totalSubscribers} 명`;
      document.getElementById('todayRedeemedCount').innerText = `${state.todayRedeemedCount} 건`;
      
      const rate = ((state.todayRedeemedCount / state.totalSubscribers) * 100).toFixed(1);
      document.getElementById('redemptionRateText').innerText = `${rate}%`;
    }

    // Dynamic QR Timer
    function startQrTimer() {
      let seconds = 60;
      setInterval(() => {
        seconds--;
        if (seconds <= 0) seconds = 60;
        document.getElementById('qrTimer').innerHTML = `<i class="fa-regular fa-clock mr-1"></i>${seconds}초 남음`;
      }, 1000);
    }
  </script>
</body>
</html>
